{% extends 'base.html' %}

{% block title %}
Iniciar Sesión
{% endblock %}

{% block sesion %}
Cerrar Sesión
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-5">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

                <!-- HEADER -->
                <div class="bg-danger text-white text-center p-5">

                    <i class="fas fa-user-shield fa-4x mb-3"></i>

                    <h2 class="fw-bold">
                        Sistema Clínico
                    </h2>

                    <p class="mb-0">
                        Inicia sesión para continuar
                    </p>

                </div>


                <!-- BODY -->
                <div class="card-body p-5">

                    <form method="POST">

                        <!-- USERNAME -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                <i class="fas fa-user"></i>
                                Usuario

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control form-control-lg rounded-3"
                                placeholder="Ingrese su usuario"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                <i class="fas fa-lock"></i>
                                Contraseña

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control form-control-lg rounded-3"
                                placeholder="Ingrese su contraseña"
                                required
                            >

                        </div>


                        <!-- BOTON -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-danger btn-lg rounded-3"
                            >

                                <i class="fas fa-sign-in-alt"></i>
                                Ingresar al Sistema

                            </button>

                        </div>

                    </form>


                    <!-- INFO -->
                    <div class="text-center mt-4 text-muted">

                        <small>
                            Panel administrativo y gestión clínica
                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
