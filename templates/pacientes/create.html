{% extends 'base.html' %}

{% block title %}
Registrar Paciente
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white p-4 rounded-top-4">

                    <h2 class="mb-0">
                        <i class="fas fa-user-injured"></i>
                        Registrar Paciente
                    </h2>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Nombre Completo
                                </label>

                                <input type="text" name="nombre" class="form-control form-control-lg"
                                    placeholder="Ingrese el nombre" required>

                            </div>


                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Edad
                                </label>

                                <input type="number" name="edad" class="form-control form-control-lg" placeholder="Edad"
                                    required>

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Dirección
                            </label>

                            <input type="text" name="direccion" class="form-control form-control-lg"
                                placeholder="Ingrese dirección" required>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input type="text" name="telefono" class="form-control form-control-lg"
                                placeholder="Ingrese teléfono" required>

                        </div>


                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary btn-lg rounded-3">

                                <i class="fas fa-save"></i>
                                Guardar Paciente

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
