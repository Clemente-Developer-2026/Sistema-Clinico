{% extends 'base.html' %}
{% block title %} CONSULTAS - CREATE {% endblock %}

{% block content %}
<h1>Registro de consulta</h1>

<form action="{{ url_for('consulta.create') }}" class="form form-control" method="POST">
    <div class="mb-3">
        <label for="" class="form-label">Fecha</label>
        <input type="date" class="form-control" name="fecha">
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Diagnostico</label>
        <input type="text" class="form-control" name="diagnostico">
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Tratamiento</label>
        <input type="text" class="form-control" name="tratamiento">
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Medico</label>
        <select name="id_medico" class="form form-control" required>
            <option value="">Seleccione un Medico</option>
            {% for medico in medicos %}
            <option value="{{medico.id}}">{{medico.nombre}}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="" class="form-label">Paciente</label>
        <select name="id_paciente" class="form form-control" required>
            <option value="">Seleccione un Paciente</option>
            {% for paciente in pacientes %}
            <option value="{{paciente.id}}">{{paciente.nombre}}</option>
            {% endfor %}
        </select>
        
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
</form>


{% endblock %}
