{% extends 'base.html' %}

{% block title %}
Registrar Consulta
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-danger text-white p-4 rounded-top-4">

                    <h2 class="mb-0">
                        <i class="fas fa-notes-medical"></i>
                        Nueva Consulta Médica
                    </h2>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Médico
                                </label>

                                <select
                                    name="id_medico"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Seleccione un médico
                                    </option>

                                    {% for medico in medicos %}

                                    <option value="{{ medico.id_medico }}">

                                        {{ medico.nombre }}
                                        -
                                        {{ medico.especialidad }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Paciente
                                </label>

                                <select
                                    name="id_paciente"
                                    class="form-select form-select-lg"
                                    required
                                >

                                    <option value="">
                                        Seleccione un paciente
                                    </option>

                                    {% for paciente in pacientes %}

                                    <option value="{{ paciente.id_paciente }}">

                                        {{ paciente.nombre }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Fecha
                            </label>

                            <input
                                type="date"
                                name="fecha"
                                class="form-control form-control-lg"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Diagnóstico
                            </label>

                            <textarea
                                name="diagnostico"
                                rows="4"
                                class="form-control"
                                placeholder="Ingrese diagnóstico"
                                required
                            ></textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Tratamiento
                            </label>

                            <textarea
                                name="tratamiento"
                                rows="4"
                                class="form-control"
                                placeholder="Ingrese tratamiento"
                                required
                            ></textarea>

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-danger btn-lg rounded-3"
                            >

                                <i class="fas fa-save"></i>
                                Guardar Consulta

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
